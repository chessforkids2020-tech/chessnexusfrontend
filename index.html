<!doctype html>
<html lang="en" data-theme="obsidianGlass">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      THEME BOOTSTRAP — must stay here, inline and before any stylesheet.

      NOTE: nothing may be inserted between <!doctype html> and <html>.
      @vitejs/plugin-react finds its dev preamble by matching on the start of the
      document, and a comment there makes it fail with "can't detect preamble" —
      in the DEV SERVER ONLY, so a production build looks perfectly fine. The
      data-theme default therefore lives on the <html> tag above with no comment
      attached; this block documents it instead.

      The default on <html> is only a fallback. The script below overwrites it
      with the signed-in user's saved choice before the first paint.

      React sets data-theme too (see src/contexts/UiThemeContext.jsx), but that
      only runs after the bundle has downloaded, parsed and mounted. By then the
      browser has already painted, so a user whose theme is Deep Ember would see
      a flash of the default cyan first. This script runs synchronously during
      head parsing, before the first paint, which is the only place the flash can
      actually be prevented.

      `lastUserId` is written by AppWithTheme in src/App.jsx. It exists because
      this script cannot wait for the auth check to resolve — it needs to know
      which uiTheme_<id> key to read while the page is still blank.

      Everything is wrapped in try/catch: localStorage throws in some privacy
      modes and inside sandboxed iframes, and a theme preference must never be
      able to stop the page loading. The id is validated against the known list
      so a stale or hand-edited value cannot select a palette that no longer
      exists (which would leave the app with no colours at all).
    -->
    <script>
      (function () {
        try {
          var VALID = ['obsidianGlass', 'midnightCyan', 'slateBlueSteel',
                       'deepEmber', 'purpleHaze', 'obsidianRose',
                       'obsidianEmerald', 'royalViolet', 'goldSovereign'];
          var uid = localStorage.getItem('lastUserId');
          var key = uid ? 'uiTheme_' + uid : 'uiTheme_guest';
          var saved = localStorage.getItem(key);
          if (saved && VALID.indexOf(saved) !== -1) {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* keep the default already on <html> */
        }
      })();
    </script>

    <!--
      Per-page SEO tags (title, description, keywords, canonical, robots,
      Open Graph, Twitter) are managed at runtime by react-helmet-async via
      src/components/SEO.jsx, and are baked into each prerendered page by
      prerender.js. They are intentionally NOT hardcoded here — duplicating
      them would produce two <title>/canonical/og:* tags on prerendered pages.
      A default title (below) prevents an empty tab title before hydration.
    -->
    <title>Chess Nexus — Online Chess Puzzles, Tactics &amp; Live Races</title>
    <meta name="author" content="Chess Nexus" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="msapplication-TileColor" content="#06b6d4" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://www.chessnexus.in" />
    <link rel="dns-prefetch" href="https://www.chessnexus.in" />

    <!-- JSON-LD: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Chess Nexus",
      "url": "https://www.chessnexus.in/",
      "description": "Free online chess platform for solving puzzles, practicing tactics, and competing in live arena races.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web Browser",
      "browserRequirements": "Requires JavaScript",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "featureList": [
        "Daily Chess Puzzles",
        "Live Arena Races",
        "Chess Tactics Training",
        "Monthly Focus Challenges",
        "Global Leaderboard",
        "Team Race Mode",
        "Chess Study System"
      ],
      "screenshot": "https://www.chessnexus.in/logo.png",
      "inLanguage": "en"
    }
    </script>

    <!-- JSON-LD: Organization — 'alternateName' + 'sameAs' help Google treat
         "chessnexus" and "chess nexus" as the SAME brand entity and consolidate
         search results. Fill in every official profile URL under sameAs; the more
         verified profiles, the stronger the brand signal. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Chess Nexus",
      "alternateName": ["ChessNexus", "Chess Nexus Academy", "chessnexus.in"],
      "url": "https://www.chessnexus.in/",
      "logo": "https://www.chessnexus.in/logo.png",
      "sameAs": [
        "https://www.instagram.com/chessnexus.in/",
        "https://www.facebook.com/profile.php?id=100064068341481"
      ],
      "description": "Chess Nexus is a free online chess training and competition platform offering puzzles, tactics, live races, and leaderboards."
    }
    </script>

    <!-- JSON-LD: WebSite — helps Google understand the site as a single entity -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Chess Nexus",
      "alternateName": "ChessNexus",
      "url": "https://www.chessnexus.in/"
    }
    </script>

    <!-- JSON-LD: SiteNavigationElement — the strongest signal Google uses to
         build sitelinks. Order matters: Google favours the earliest items, and
         typically shows ~4-6. The priority quick-actions (Sign up, Coach, Learn,
         Tournaments, Analyze) are listed FIRST so they're the strongest sitelink
         candidates. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Chess Nexus main navigation",
      "itemListElement": [
        { "@type": "SiteNavigationElement", "position": 1, "name": "Sign Up", "description": "Create a free Chess Nexus account and start training.", "url": "https://www.chessnexus.in/signup-request" },
        { "@type": "SiteNavigationElement", "position": 2, "name": "Sign In", "description": "Log in to your Chess Nexus account.", "url": "https://www.chessnexus.in/login" },
        { "@type": "SiteNavigationElement", "position": 3, "name": "Coach", "description": "Coach-led chess training and academy tools for coaches.", "url": "https://www.chessnexus.in/chess-coaching" },
        { "@type": "SiteNavigationElement", "position": 4, "name": "Learn Chess", "description": "Solve puzzles, train tactics and improve at chess.", "url": "https://www.chessnexus.in/improve-at-chess" },
        { "@type": "SiteNavigationElement", "position": 5, "name": "Live Tournaments", "description": "Compete in live 3D arena chess tournaments and races.", "url": "https://www.chessnexus.in/3d-chess-arena-tournament" },
        { "@type": "SiteNavigationElement", "position": 6, "name": "Analyze Game", "description": "Analyse your chess games with Stockfish and accuracy scores.", "url": "https://www.chessnexus.in/analyse-my-chess-game" },
        { "@type": "SiteNavigationElement", "position": 7, "name": "Chess Puzzles", "description": "Solve daily chess puzzles and train tactics.", "url": "https://www.chessnexus.in/chess-puzzles" },
        { "@type": "SiteNavigationElement", "position": 8, "name": "Play Chess Online", "description": "Play live chess against people or the Stockfish engine.", "url": "https://www.chessnexus.in/play-chess-online" },
        { "@type": "SiteNavigationElement", "position": 9, "name": "Chess Study", "description": "Learn with structured chess study lessons.", "url": "https://www.chessnexus.in/chess-study" },
        { "@type": "SiteNavigationElement", "position": 10, "name": "Leaderboard", "description": "See the top players on the global leaderboard.", "url": "https://www.chessnexus.in/leaderboard" }
      ]
    }
    </script>

    <!-- JSON-LD: FAQPage for SEO rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Chess Nexus free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Chess Nexus is completely free. All core features including daily puzzles, tactics training, and live arena races are available at no cost."
          }
        },
        {
          "@type": "Question",
          "name": "What chess features does Chess Nexus offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Chess Nexus offers daily chess puzzles, live arena races, team race mode, monthly focus challenges, a global leaderboard, chess study system, and tactics training."
          }
        },
        {
          "@type": "Question",
          "name": "How do I improve my chess rating on Chess Nexus?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Solve daily puzzles, participate in arena races, complete monthly focus challenges, and use the study system to improve your chess rating on Chess Nexus."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
